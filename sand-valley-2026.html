<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sand Valley 2026 Results | Nakoma Tour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #f6f1e6;
            --card: #fffaf1;
            --panel: #efe7d4;
            --ink: #24291f;
            --muted: #6f6a5c;
            --green: #33513a;
            --green-dark: #22331f;
            --clay: #c2703d;
            --clay-dark: #a85a2e;
            --line: #e3d9c4;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: inherit; }

        body {
            margin: 0;
            font-family: 'Karla', Arial, Helvetica, sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            color: #fffaf1;
            text-align: center;
            padding: 90px 20px;
        }

        header h1 {
            margin: 0;
            font-family: 'Fraunces', Georgia, serif;
            font-size: 54px;
            letter-spacing: 3px;
            font-weight: 800;
        }

        header p {
            margin: 15px 0 0;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            color: #e7dfcc;
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 26px;
            box-shadow: 0 6px 20px rgba(40,30,10,0.06);
        }

        .section h2 {
            margin-top: 0;
            font-family: 'Fraunces', Georgia, serif;
            font-size: 26px;
            font-weight: 600;
            border-bottom: 2px solid var(--line);
            padding-bottom: 14px;
        }

        .legend {
            display: flex;
            gap: 22px;
            margin: 18px 0 6px;
            font-size: 13px;
            color: var(--muted);
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .swatch {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            display: inline-block;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .name {
            width: 155px;
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 600;
            text-align: right;
        }

        .track {
            flex: 1;
            background: var(--line);
            border-radius: 6px;
            height: 22px;
            position: relative;
        }

        .fill {
            height: 100%;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
        }

        .fill.highlight {
            background: linear-gradient(90deg, var(--green), var(--green-dark));
        }

        .fill.other {
            background: linear-gradient(90deg, var(--clay), var(--clay-dark));
        }

        .val {
            font-size: 11px;
            font-weight: 700;
            color: #fffaf1;
        }

        .back {
            display: inline-block;
            margin-top: 5px;
            color: var(--green);
            text-decoration: none;
            font-weight: 700;
        }

        .back:hover {
            color: var(--green-dark);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 14px;
            border-top: 1px solid var(--line);
        }

        @media (max-width: 700px) {
            header {
                padding: 70px 20px;
            }

            header h1 {
                font-size: 38px;
                letter-spacing: 2px;
            }

            .section {
                padding: 24px;
            }

            .name {
                width: 110px;
                font-size: 11.5px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Sand Valley 2026</h1>
        <p>Team Match Play Results</p>
    </header>

    <main>

        <section class="section">
            <h2>Total Points Leaderboard</h2>

            <div class="legend">
                <span><span class="swatch" style="background:var(--green)"></span>Team Yde</span>
                <span><span class="swatch" style="background:var(--clay)"></span>Team A. Fil</span>
            </div>

            <div id="chart"></div>
        </section>

        <!-- BACK -->
        <a class="back" href="tour-history.html">
            ← Back to Tour History
        </a>

    </main>

    <footer>
        Nakoma Tour © 2026
    </footer>

    <script>
        const highlighted = new Set([
            "Alex Yde", "Austin Resop", "Bobby Price", "Josh Duggan",
            "Alex Wodarczyk", "Pete Daniels", "Jeff Bubbers", "John D'Orazio",
            "Tucker Smith", "Kevin Tancredi", "James West", "Michael Johnson"
        ]);

        const data = [
            ["Alex Wodarczyk", 10], ["Jeff Bubbers", 8], ["Drew Dretske", 8], ["Alex Yde", 7.5],
            ["Tucker Smith", 7], ["James West", 7], ["Pete Daniels", 7], ["John D'Orazio", 7],
            ["Austin Resop", 6.5], ["Bobby Price", 6.5], ["Kevin Tancredi", 5.5], ["Alex Filkouski", 5.5],
            ["Tyler Wedel", 5], ["Kent Davyduke", 5], ["Josh Duggan", 5], ["Ben Filkouski", 4.5],
            ["Landon Vinger", 4], ["Ty Weimer", 4], ["Catul Kiti", 3.5], ["Mike Doers", 3],
            ["Andrew Buss", 3], ["Nate Gorman", 3], ["Michael Johnson", 2], ["Mickey Defilippo", 2],
            ["Brian Kopp (Sub)", 1.5], ["Chazz Huston (Sub)", 1]
        ];

        const max = Math.max(...data.map(d => d[1]));
        const chart = document.getElementById("chart");

        data.forEach(([name, val]) => {
            const row = document.createElement("div");
            row.className = "row";
            const cls = highlighted.has(name) ? "highlight" : "other";
            row.innerHTML = `
                <div class="name">${name}</div>
                <div class="track">
                    <div class="fill ${cls}" style="width:${(val / max) * 100}%">
                        <span class="val">${val}</span>
                    </div>
                </div>
            `;
            chart.appendChild(row);
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nakoma Tour</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f1;
            color: #1f2a24;
        }

        header {
            background-image:
                linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                url('commons.jpeg');
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 120px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 56px;
            letter-spacing: 4px;
            font-weight: 800;
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .choices {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .box {
            background: white;
            border-radius: 14px;
            padding: 45px 35px;
            flex: 1;
            min-width: 300px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .box h2 {
            margin-top: 0;
            font-size: 32px;
        }

        .box p {
            font-size: 17px;
            line-height: 1.6;
            color: #555;
            min-height: 55px;
        }

        .button {
            display: block;
            margin-top: 30px;
            background: #1f2a24;
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: 10px;
            font-size: 19px;
            font-weight: bold;
        }

        .button:hover {
            opacity: 0.85;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 650px) {
            header {
                padding: 90px 20px;
            }

            header h1 {
                font-size: 42px;
            }

            .box {
                min-width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>NAKOMA TOUR</h1>
    </header>

    <main>

        <div class="choices">

            <!-- NAKOMA TOUR -->
            <section class="box">
                <h2>Nakoma Tour</h2>

                <p>
                    Annual golf trips, upcoming tours,
                    results, history, and more.
                </p>

                <a class="button" href="nakoma-tour.html">
                    Enter Nakoma Tour
                </a>
            </section>


            <!-- BDO -->
            <section class="box">
                <h2>BDO</h2>

                <p>
                    BDO tournament history, champions,
                    results, standings, and more.
                </p>

                <a class="button" href="bdo.html">
                    Enter BDO
                </a>
            </section>

        </div>

    </main>

    <footer>
        Nakoma Tour © 2026
    </footer>

</body>
</html>

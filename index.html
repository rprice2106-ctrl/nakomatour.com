<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nakoma Tour</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ed;
            color: #1f2a24;
        }

        header {
    background-image:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url('Nak.jpeg');
    background-size: cover;
    background-position: center;
    color: white;
    text-align: center;
    padding: 110px 20px;
}
        }

        header h1 {
            font-size: 52px;
            margin: 0 0 10px;
            letter-spacing: 3px;
        }

        header p {
            font-size: 18px;
            margin: 0;
        }

        main {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section {
            margin-bottom: 50px;
        }

        h2 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h3 {
            font-size: 24px;
            margin-top: 0;
        }

        .card p {
            color: #666;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 22px;
            background: #1f2a24;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            opacity: 0.85;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>NAKOMA TOUR</h1>
    <p>Golf. Competition. Tradition.</p>
</header>

<main>

    <section class="section">
        <h2>BDO History</h2>

        <div class="cards">

            <div class="card">
                <h3>BDO 2025</h3>
                <p>The inaugural chapter of BDO history.</p>
                <a href="#" class="button">View 2025</a>
            </div>

            <div class="card">
                <h3>BDO 2026</h3>
                <p>
                    2026 Champions:<br>
                    <strong>Kent Davyduke & Mike Doers</strong>
                </p>
                <a href="#" class="button">View 2026</a>
            </div>

        </div>
    </section>

    <section class="section">
        <h2>Nakoma Tour</h2>

        <div class="cards">

            <div class="card">
                <h3>Nakoma Tour</h3>
                <p>
                    Follow the tour, standings, events,
                    results and history.
                </p>
                <a href="#" class="button">Enter the Tour</a>
            </div>

        </div>
    </section>

</main>

<footer>
    Nakoma Tour © 2026
</footer>

</body>
</html>

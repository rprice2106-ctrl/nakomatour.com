<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nakoma Tour</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f1;
            color: #1f2a24;
        }

        header {
            background-image:
                linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                url('commons.jpeg');
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 100px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 52px;
            letter-spacing: 4px;
            font-weight: 800;
        }

        main {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .button-box {
            background: white;
            border-radius: 14px;
            padding: 40px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }

        .button {
            display: block;
            background: #1f2a24;
            color: white;
            text-decoration: none;
            padding: 25px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        .button:hover {
            opacity: 0.85;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 35px;
            color: #1f2a24;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header {
                padding: 80px 20px;
            }

            header h1 {
                font-size: 40px;
            }

            .button-box {
                padding: 25px;
            }

            .button {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <header>

    </header>

    <main>

        </section>

        <section class="button-box">
            <a class="button" href="tour-history.html">

            </a>
        </section>


        <a class="back" href="index.html">

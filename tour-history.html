<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tour History | Nakoma Tour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #f6f1e6;
            --card: #fffaf1;
            --ink: #24291f;
            --muted: #6f6a5c;
            --green: #33513a;
            --green-dark: #22331f;
            --clay: #c2703d;
            --line: #e3d9c4;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            font-family: 'Karla', Arial, Helvetica, sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            color: #fffaf1;
            text-align: center;
            padding: 100px 20px;
        }

        header h1 {
            margin: 0;
            font-family: 'Fraunces', Georgia, serif;
            font-size: 52px;
            letter-spacing: 4px;
            font-weight: 800;
        }

        header p {
            margin: 15px 0 0;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            color: #e7dfcc;
        }

        main {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .button-box {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 34px;
            margin-bottom: 22px;
            box-shadow: 0 6px 20px rgba(40,30,10,0.06);
            text-align: center;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .button-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 26px rgba(40,30,10,0.10);
        }

        .button {
            display: block;
            background: var(--green);
            color: #fffaf1;
            text-decoration: none;
            padding: 22px;
            border-radius: 10px;
            font-family: 'Fraunces', Georgia, serif;
            font-size: 23px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: background 0.15s ease;
        }

        .button:hover {
            background: var(--green-dark);
        }

        .back {
            display: inline-block;
            width: 100%;
            text-align: center;
            margin-top: 30px;
            color: var(--clay);
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
        }

        .back:hover {
            color: var(--green-dark);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 14px;
            border-top: 1px solid var(--line);
        }

        @media (max-width: 600px) {
            header {
                padding: 80px 20px;
            }

            header h1 {
                font-size: 38px;
                letter-spacing: 3px;
            }

            .button-box {
                padding: 24px;
            }

            .button {
                font-size: 20px;
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>TOUR HISTORY</h1>
        <p>Every trip, every result</p>
    </header>

    <main>

        <section class="button-box">
            <a class="button" href="sand-valley-2026.html">
                Sand Valley 2026 Results
            </a>
        </section>

        <section class="button-box">
            <a class="button" href="sand-valley-2024.html">
                Sand Valley 2024 Results
            </a>
        </section>

        <section class="button-box">
            <a class="button" href="sand-valley-2022.html">
                Sand Valley 2022 Results
            </a>
        </section>

        <a class="back" href="nakoma-tour.html">
            ← Back to Nakoma Tour
        </a>

    </main>

    <footer>
        Nakoma Tour © 2026
    </footer>

</body>
</html>

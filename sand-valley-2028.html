<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sand Valley 2028 — Nakoma Tour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #f6f1e6;
            --card: #fffaf1;
            --ink: #24291f;
            --muted: #6f6a5c;
            --green: #33513a;
            --green-dark: #22331f;
            --clay: #c2703d;
            --line: #e3d9c4;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Karla', Arial, Helvetica, sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.6;
        }

        main {
            max-width: 480px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 50px 34px;
            box-shadow: 0 6px 20px rgba(40,30,10,0.06);
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
            font-weight: 700;
            color: var(--clay);
            margin-bottom: 14px;
        }

        h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 34px;
            font-weight: 800;
            margin: 0 0 14px;
        }

        .card p {
            color: var(--muted);
            font-size: 16px;
            margin: 0;
        }

        .back {
            display: inline-block;
            margin-top: 28px;
            color: var(--green);
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
        }

        .back:hover {
            color: var(--green-dark);
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 24px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <main>
        <div class="card">
            <div class="eyebrow">Sand Valley 2028</div>
            <h1>Planning Is Underway</h1>
            <p>Come back in early 2027 for more details.</p>
        </div>
        <a class="back" href="nakoma-tour.html">← Back to Nakoma Tour</a>
    </main>

</body>
</html>

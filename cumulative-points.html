<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cumulative Points | Nakoma Tour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #f6f1e6;
            --card: #fffaf1;
            --ink: #24291f;
            --muted: #6f6a5c;
            --green: #33513a;
            --green-dark: #22331f;
            --line: #e3d9c4;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: inherit; }

        body {
            margin: 0;
            font-family: 'Karla', Arial, Helvetica, sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            color: #fffaf1;
            text-align: center;
            padding: 90px 20px;
        }

        header h1 {
            margin: 0;
            font-family: 'Fraunces', Georgia, serif;
            font-size: 46px;
            letter-spacing: 2px;
            font-weight: 800;
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 26px;
            box-shadow: 0 6px 20px rgba(40,30,10,0.06);
        }

        .section h2 {
            margin-top: 0;
            font-family: 'Fraunces', Georgia, serif;
            font-size: 24px;
            font-weight: 600;
            border-bottom: 2px solid var(--line);
            padding-bottom: 14px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .name {
            width: 155px;
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 600;
            text-align: right;
        }

        .track {
            flex: 1;
            background: var(--line);
            border-radius: 6px;
            height: 22px;
        }

        .fill {
            height: 100%;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            background: linear-gradient(90deg, var(--green), var(--green-dark));
        }

        .val {
            font-size: 11px;
            font-weight: 700;
            color: #fffaf1;
        }

        .back {
            display: inline-block;
            margin-top: 5px;
            color: var(--green);
            text-decoration: none;
            font-weight: 700;
        }

        .back:hover {
            color: var(--green-dark);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 14px;
            border-top: 1px solid var(--line);
        }

        @media (max-width: 700px) {
            header {
                padding: 70px 20px;
            }

            header h1 {
                font-size: 34px;
                letter-spacing: 1px;
            }

            .section {
                padding: 24px;
            }

            .name {
                width: 110px;
                font-size: 11.5px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Cumulative Points</h1>
    </header>

    <main>

        <section class="section">
            <h2>Cumulative Points &mdash; All Trips</h2>
            <div id="chart"></div>
        </section>

        <!-- BACK -->
        <a class="back" href="tour-history.html">
            ← Back to Tour History
        </a>

    </main>

    <footer>
        Nakoma Tour © 2026
    </footer>

    <script>
        const data = [
            ["Tucker Smith", 13], ["Bobby Price", 12], ["Tyler Wedel", 11.5], ["James West", 11.5],
            ["Catul Kiti", 11], ["Alex Wodarczyk", 10], ["Ty Weimer", 10], ["Pete Daniels", 10],
            ["Austin Resop", 9.5], ["Alex Yde", 9.5], ["Ben Filkouski", 9], ["Alex Filkouski", 8.5],
            ["John D'Orazio", 8.5], ["Jeff Bubbers", 8], ["Drew Dretske", 8], ["Landon Vinger", 8],
            ["Keith Batenhorst", 7], ["Kent Davyduke", 7], ["Andrew Buss", 7], ["Ethan Miller", 6],
            ["Michael Johnson", 6], ["Kevin Tancredi", 5.5], ["Josh Duggan", 5], ["Mike Doers", 3.5],
            ["Chris Streff", 3], ["Nate Gorman", 3], ["Nick Oliphant", 2.5], ["Andrew Klein", 2],
            ["Chris Peterson", 2], ["Mickey Defilippo", 2], ["Brian Kopp", 1.5], ["Chazz Huston", 1]
        ];

        const max = Math.max(...data.map(d => d[1]));
        const chart = document.getElementById("chart");

        data.forEach(([name, val]) => {
            const row = document.createElement("div");
            row.className = "row";
            row.innerHTML = `
                <div class="name">${name}</div>
                <div class="track">
                    <div class="fill" style="width:${(val / max) * 100}%">
                        <span class="val">${val}</span>
                    </div>
                </div>
            `;
            chart.appendChild(row);
        });
    </script>

</body>
</html>
